<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>风</title>
<meta name="description" content="每天一段。读完就走。">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">

<style>
  @font-face { font-family: "Feng"; src: url(fonts/feng.woff2) format("woff2"); font-weight: 300; font-display: swap; }
  /* ---------- 颜色随一天的时辰走 ---------- */
  :root {
    --paper: #eef1f3; --paper-deep: #e4e9ec;
    --ink: #23282c; --ink-soft: #6a737a; --ink-faint: #b3bbc0;
    --wind: 62, 74, 84;          /* 风的颜色（rgb 三元组，画布用） */
    --wind-alpha: .19;
    --serif: "Feng", "Noto Serif SC", "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
    --brush: "Feng", "Ma Shan Zheng", "STKaiti", "KaiTi", "Noto Serif SC", serif;
    --latin: "Feng", "Noto Serif", Georgia, "Times New Roman", serif;
  }
  :root[data-tod="dawn"] {
    --paper: #eef0ec; --paper-deep: #e3e7e1;
    --ink: #2a2e2b; --ink-soft: #6c746e; --ink-faint: #b4bcb5; --wind: 92, 108, 96;
  }
  :root[data-tod="dusk"] {
    --paper: #ecebf0; --paper-deep: #dedce6;
    --ink: #2b2a32; --ink-soft: #6e6c7a; --ink-faint: #b5b3c0; --wind: 96, 90, 122;
  }
  :root[data-tod="night"], :root[data-theme="dark"] {
    --paper: #14171a; --paper-deep: #0e1013;
    --ink: #d4d8db; --ink-soft: #8b9298; --ink-faint: #40474c;
    --wind: 168, 178, 186; --wind-alpha: .16;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14171a; --paper-deep: #0e1013;
      --ink: #d4d8db; --ink-soft: #8b9298; --ink-faint: #40474c;
      --wind: 168, 178, 186; --wind-alpha: .16;
    }
  }
  :root[data-theme="light"] {
    --paper: #eef1f3; --paper-deep: #e4e9ec;
    --ink: #23282c; --ink-soft: #6a737a; --ink-faint: #b3bbc0;
    --wind: 62, 74, 84; --wind-alpha: .19;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 40%, var(--paper) 0%, var(--paper-deep) 100%);
    color: var(--ink);
    font-family: var(--serif); font-weight: 300;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    transition: background 3s ease, color 3s ease;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 1px solid var(--ink-soft); outline-offset: 6px; }

  /* 风：铺满，画在文字后面 */
  #wind {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    /* 风绕开卷轴：中间留一片静处，字才读得清 */
    -webkit-mask-image: radial-gradient(ellipse 30% 46% at 50% 47%, transparent 30%, rgba(0,0,0,.55) 70%, #000 100%);
            mask-image: radial-gradient(ellipse 30% 46% at 50% 47%, transparent 30%, rgba(0,0,0,.55) 70%, #000 100%);
  }

  .page {
    position: relative; z-index: 1;
    height: 100dvh; display: grid; place-items: center;
    padding: 12vh 8vw;
  }

  .date {
    position: absolute; top: 7vh; right: 7vw; margin: 0;
    writing-mode: vertical-rl;
    font-size: .8rem; letter-spacing: .28em; color: var(--ink-soft);
    transition: color 3s ease;
  }

  /* 正文：竖排。整块像挂着的卷轴，在风里微微摆。 */
  .passage {
    writing-mode: vertical-rl; text-orientation: mixed;
    height: min(62vh, 680px); max-width: 84vw;
    font-size: clamp(1.2rem, 1.9vw, 1.55rem); line-height: 2.15; letter-spacing: .1em;
    margin: 0;
  }
  .text { margin: 0; text-wrap: pretty; }
  .text .ch {
    display: inline-block; opacity: 0;
    transition: transform var(--dur, 1.6s) cubic-bezier(.16, .7, .18, 1),
                opacity   var(--dur, 1.6s) ease,
                filter    var(--dur, 1.6s) ease;
    transition-delay: var(--d, 0s);
    will-change: transform, opacity, filter;
  }
  .text .ch.in { opacity: 1; transform: none; filter: blur(0); }

  /* 原文：另起一列，横着躺在竖排的中文旁边。 */
  .orig {
    margin: 0; margin-block-start: 1.1em;
    font-family: var(--latin); font-style: italic; font-weight: 300;
    font-size: .66em; line-height: 1.9; letter-spacing: .01em;
    text-orientation: sideways;
    color: var(--ink-soft);
    opacity: 0; transition: opacity 2s ease; transition-delay: var(--sd, 2.4s);
  }
  .orig.in { opacity: 1; }
  .orig:empty { display: none; }
  .orig[lang="ja"] { font-family: var(--serif); font-style: normal; text-orientation: mixed; }

  .source {
    margin: 0; margin-block-start: 1.4em; padding-inline-start: var(--drop, 42%);
    font-size: .74em; letter-spacing: .16em; color: var(--ink-soft);
    opacity: 0; transition: opacity 2s ease; transition-delay: var(--sd, 2.4s);
  }
  .source.in { opacity: 1; }
  .source .note { color: var(--ink-faint); margin-inline-start: 1.2em; }

  .mark {
    position: absolute; left: 7vw; bottom: 6vh;
    font-family: var(--brush); font-weight: 400; font-size: 1.7rem; line-height: 1;
    color: var(--ink-soft);
  }

  .nav {
    position: absolute; right: 7vw; bottom: 6.6vh;
    display: flex; gap: 1.6em;
    font-size: .78rem; letter-spacing: .22em; color: var(--ink-faint);
  }
  .nav a { transition: color .6s ease; cursor: pointer; }
  .nav a:hover, .nav a[aria-pressed="true"] { color: var(--ink-soft); }
  .nav a[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .text .ch { transition-duration: .3s; transition-delay: 0s !important; }
    #wind { display: none; }
  }

  @media (max-width: 720px), (max-height: 520px) {
    .page { padding: 16vh 9vw 18vh; }
    .date { top: 7vh; left: 9vw; right: auto; writing-mode: horizontal-tb; }
    .passage {
      writing-mode: horizontal-tb; height: auto; max-width: 34em;
      font-size: 1.2rem; line-height: 2.05; letter-spacing: .06em;
    }
    .orig { margin: 1.5em 0 0; font-size: .86rem; text-orientation: initial; }
    .source { margin: 1.6em 0 0; padding: 0; text-align: right; }
    .source .note { margin: 0 0 0 1em; }
    .mark { left: 9vw; bottom: 6vh; }
    .nav { right: 9vw; bottom: 6.8vh; }
  }
</style>
</head>
<body>
<canvas id="wind" aria-hidden="true"></canvas>

<main class="page">
  <p class="date"><time id="date"></time></p>
  <noscript><p class="text" style="opacity:1">风。每天一段。请开启 JavaScript。</p></noscript>
  <article class="passage" id="passage" aria-live="polite">
    <p class="text" id="text"></p>
    <p class="orig" id="orig"></p>
    <p class="source" id="source"></p>
  </article>
  <a class="mark" id="mark" href="./" aria-label="风，回到今日">风</a>
  <nav class="nav" aria-label="日期与声音">
    <a id="today" href="./" hidden>今日</a>
    <a id="yesterday" href="#">昨日</a>
    <a id="sound" role="button" aria-pressed="false" title="风声">声</a>
  </nav>
</main>

<script id="passages" type="application/json">[{"t":"时有风吹幡动，一僧曰风动，一僧曰幡动，议论不已。惠能进曰：「不是风动，不是幡动，仁者心动。」","s":"《六祖坛经》行由品"},{"t":"夫大块噫气，其名为风。是唯无作，作则万窍怒呺。而独不闻之翏翏乎？","s":"《庄子》齐物论","w":1.5,"season":"autumn"},{"t":"「莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。」夫子喟然叹曰：「吾与点也！」","s":"《论语》先进","w":1.2,"season":"spring"},{"t":"踏进同一条河的人，遇到的总是不同的水。\n自然爱隐藏。\n时间是一个掷骰子的孩子；王权属于孩子。","s":"赫拉克利特 残篇","n":"试译","l":"grc","o":"ποταμοῖσι τοῖσιν αὐτοῖσιν ἐμβαίνουσιν ἕτερα καὶ ἕτερα ὕδατα ἐπιρρεῖ. / φύσις κρύπτεσθαι φιλεῖ. / αἰὼν παῖς ἐστι παίζων, πεσσεύων· παιδὸς ἡ βασιληίη.","w":0.9},{"t":"你走遍每一条路，也找不到灵魂的边界；它的逻各斯如此之深。","s":"赫拉克利特 残篇","n":"试译","l":"grc","o":"ψυχῆς πείρατα ἰὼν οὐκ ἂν ἐξεύροιο, πᾶσαν ἐπιπορευόμενος ὁδόν· οὕτω βαθὺν λόγον ἔχει."},{"t":"莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。","s":"苏轼《定风波》","w":1.3,"season":"spring"},{"t":"春有百花秋有月，夏有凉风冬有雪。\n若无闲事挂心头，便是人间好时节。","s":"无门慧开《无门关》"},{"t":"天地之间，其犹橐籥乎？虚而不屈，动而愈出。多言数穷，不如守中。","s":"《老子》第五章","w":1.2},{"t":"上行的路和下行的路，是同一条。\n德尔斐的神既不说出，也不隐藏，只是示意。","s":"赫拉克利特 残篇","n":"试译","l":"grc","o":"ὁδὸς ἄνω κάτω μία καὶ ὡυτή. / ὁ ἄναξ οὗ τὸ μαντεῖόν ἐστι τὸ ἐν Δελφοῖς, οὔτε λέγει οὔτε κρύπτει ἀλλὰ σημαίνει."},{"t":"因为思与在，是同一回事。","s":"巴门尼德 残篇","n":"试译","l":"grc","o":"τὸ γὰρ αὐτὸ νοεῖν ἐστίν τε καὶ εἶναι."},{"t":"井蛙不可以语于海者，拘于虚也；夏虫不可以语于冰者，笃于时也；曲士不可以语于道者，束于教也。","s":"《庄子》秋水","season":"summer"},{"t":"庄子曰：「鯈鱼出游从容，是鱼之乐也。」惠子曰：「子非鱼，安知鱼之乐？」庄子曰：「子非我，安知我不知鱼之乐？」","s":"《庄子》秋水","season":"summer"},{"t":"上善若水。水善利万物而不争，处众人之所恶，故几于道。","s":"《老子》第八章"},{"t":"甜是约定，苦是约定，热、冷、颜色都是约定；真实的只有原子和虚空。","s":"德谟克利特 残篇","n":"试译","l":"grc","o":"νόμῳ γλυκὺ καὶ νόμῳ πικρόν, νόμῳ θερμόν, νόμῳ ψυχρόν, νόμῳ χροιή· ἐτεῇ δὲ ἄτομα καὶ κενόν."},{"t":"惊异正是哲学家的感受；哲学没有别的开端，只有这一个。","s":"柏拉图《泰阿泰德》","n":"试译","l":"grc","o":"μάλα γὰρ φιλοσόφου τοῦτο τὸ πάθος, τὸ θαυμάζειν· οὐ γὰρ ἄλλη ἀρχὴ φιλοσοφίας ἢ αὕτη."},{"t":"三十辐共一毂，当其无，有车之用。埏埴以为器，当其无，有器之用。凿户牖以为室，当其无，有室之用。故有之以为利，无之以为用。","s":"《老子》第十一章"},{"t":"子在川上曰：「逝者如斯夫！不舍昼夜。」","s":"《论语》子罕","w":0.9},{"t":"饭疏食饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。","s":"《论语》述而","season":"summer"},{"t":"如果我说，每天谈论德性是人最大的好事，而未经省察的生活不值得人过，你们就更不会信我了。可事情正是如此，雅典人。","s":"柏拉图《申辩篇》","n":"试译","l":"grc","o":"ὁ δὲ ἀνεξέταστος βίος οὐ βιωτὸς ἀνθρώπῳ."},{"t":"人应当把这些话像咒语一样念给自己听——因为这是一场美的冒险。","s":"柏拉图《斐多》","n":"试译","l":"grc","o":"καλὸς γὰρ ὁ κίνδυνος, καὶ χρὴ τὰ τοιαῦτα ὥσπερ ἐπᾴδειν ἑαυτῷ."},{"t":"万物皆备于我矣。反身而诚，乐莫大焉。","s":"《孟子》尽心上","w":0.5},{"t":"先生游南镇，一友指岩中花树问曰：「天下无心外之物，如此花树在深山中自开自落，于我心亦何相关？」先生曰：「你未看此花时，此花与汝心同归于寂；你来看此花时，则此花颜色一时明白起来。便知此花不在你的心外。」","s":"王阳明《传习录》"},{"t":"王子猷居山阴，夜大雪，眠觉，开室命酌酒，四望皎然。因起彷徨，咏左思《招隐诗》，忽忆戴安道。时戴在剡，即便夜乘小船就之。经宿方至，造门不前而返。人问其故，王曰：「吾本乘兴而行，兴尽而返，何必见戴？」","s":"《世说新语》任诞","w":0.5,"season":"winter"},{"t":"求知是所有人的本性。对感觉的喜爱就是明证：即使撇开用处不谈，人们也为感觉本身而喜爱它们；而在诸感觉中，尤其喜爱视觉。","s":"亚里士多德《形而上学》开篇","n":"试译","l":"grc","o":"Πάντες ἄνθρωποι τοῦ εἰδέναι ὀρέγονται φύσει."},{"t":"一只燕子不成春天，一天也不能；同样，一天或短短一段时间，也不能使人幸福。","s":"亚里士多德《尼各马可伦理学》","n":"试译","l":"grc","o":"μία γὰρ χελιδὼν ἔαρ οὐ ποιεῖ, οὐδὲ μία ἡμέρα· οὕτω δὲ οὐδὲ μακάριον καὶ εὐδαίμονα μία ἡμέρα οὐδ' ὀλίγος χρόνος.","season":"spring"},{"t":"结庐在人境，而无车马喧。\n问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。","s":"陶渊明《饮酒》其五","w":0.5,"season":"autumn"},{"t":"云无心以出岫，鸟倦飞而知还。景翳翳以将入，抚孤松而盘桓。","s":"陶渊明《归去来兮辞》","w":0.7,"season":"autumn"},{"t":"纵浪大化中，不喜亦不惧。\n应尽便须尽，无复独多虑。","s":"陶渊明《形影神》神释"},{"t":"死亡与我们无关。因为我们存在时，死亡尚未到来；死亡到来时，我们已不存在。它既不关乎活着的人，也不关乎已死的人：对前者，它还不在；对后者，他们已不在。","s":"伊壁鸠鲁《致美诺凯乌斯》","n":"试译","l":"grc","o":"ὁ θάνατος οὐδὲν πρὸς ἡμᾶς· ὅταν μὲν ἡμεῖς ὦμεν, ὁ θάνατος οὐ πάρεστιν, ὅταν δὲ ὁ θάνατος παρῇ, τόθ' ἡμεῖς οὐκ ἐσμέν."},{"t":"隐蔽地活。","s":"伊壁鸠鲁 残篇","n":"试译","l":"grc","o":"λάθε βιώσας.","w":0.3,"season":"winter"},{"t":"天行有常，不为尧存，不为桀亡。应之以治则吉，应之以乱则凶。","s":"《荀子》天论"},{"t":"惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭，是造物者之无尽藏也，而吾与子之所共适。","s":"苏轼《前赤壁赋》","w":1.1,"season":"autumn"},{"t":"逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。","s":"苏轼《前赤壁赋》","w":0.8,"season":"autumn"},{"t":"有些事在我们能力之内，有些不在。在我们能力之内的是看法、冲动、欲望和厌恶，总之凡是我们自己的活动；不在我们能力之内的是身体、财产、名声和职位，总之凡不是我们自己的活动。","s":"爱比克泰德《手册》一","n":"试译","l":"grc","o":"Τῶν ὄντων τὰ μέν ἐστιν ἐφ' ἡμῖν, τὰ δὲ οὐκ ἐφ' ἡμῖν."},{"t":"扰乱人的不是事情本身，而是人对事情的看法。","s":"爱比克泰德《手册》五","n":"试译","l":"grc","o":"Ταράσσει τοὺς ἀνθρώπους οὐ τὰ πράγματα, ἀλλὰ τὰ περὶ τῶν πραγμάτων δόγματα."},{"t":"长恨此身非我有，何时忘却营营。夜阑风静縠纹平。小舟从此逝，江海寄余生。","s":"苏轼《临江仙》","w":0.9,"season":"autumn"},{"t":"吾生也有涯，而知也无涯。以有涯随无涯，殆已。","s":"《庄子》养生主"},{"t":"泉涸，鱼相与处于陆，相呴以湿，相濡以沫，不如相忘于江湖。","s":"《庄子》大宗师","season":"autumn"},{"t":"人们为自己寻找隐退之处：乡间、海滨、山上，你也曾极渴望这些。可这全是庸人之见，因为你随时可以退入自己心里。没有哪个地方比人自己的灵魂更宁静、更少纷扰。","s":"马可·奥勒留《沉思录》四之三","n":"试译","l":"grc","o":"οὐδαμοῦ γὰρ οὔτε ἡσυχιώτερον οὔτε ἀπραγμονέστερον ἄνθρωπος ἀναχωρεῖ ἢ εἰς τὴν ἑαυτοῦ ψυχήν.","w":0.4},{"t":"清晨不情愿起床时，让这句话在手边：我起来，是去做一个人的工作。","s":"马可·奥勒留《沉思录》五之一","n":"试译","l":"grc","o":"Ὄρθρου ὅταν δυσόκνως ἐξεγείρῃ, πρόχειρον ἔστω ὅτι ἐπὶ ἀνθρώπου ἔργον ἐγείρομαι.","season":"winter"},{"t":"致虚极，守静笃。万物并作，吾以观复。夫物芸芸，各复归其根。","s":"《老子》第十六章","w":0.15,"season":"winter"},{"t":"人生天地之间，若白驹之过隙，忽然而已。","s":"《庄子》知北游"},{"t":"荃者所以在鱼，得鱼而忘荃；蹄者所以在兔，得兔而忘蹄；言者所以在意，得意而忘言。吾安得夫忘言之人而与之言哉！","s":"《庄子》外物"},{"t":"时间是一条由发生之事汇成的河，一股湍急的流：一物刚被看见，就被冲走，另一物被带来，随即也将被带走。","s":"马可·奥勒留《沉思录》四之四十三","n":"试译","l":"grc","o":"Ποταμός τις ἐκ τῶν γινομένων καὶ ῥεῦμα βίαιον ὁ αἰών· ἅμα τε γὰρ ὤφθη ἕκαστον, καὶ παρενήνεκται καὶ ἄλλο παραφέρεται, τὸ δὲ ἐνεχθήσεται.","w":1.1},{"t":"眼睛若不先变得像太阳，便永远看不见太阳。","s":"普罗提诺《九章集》","n":"试译","l":"grc","o":"οὐ γὰρ ἂν πώποτε εἶδεν ὀφθαλμὸς ἥλιον ἡλιοειδὴς μὴ γεγενημένος."},{"t":"能闲世人之所忙者，方能忙世人之所闲。","s":"张潮《幽梦影》"},{"t":"行到水穷处，坐看云起时。","s":"王维《终南别业》"},{"t":"夫天地者，万物之逆旅也；光阴者，百代之过客也。而浮生若梦，为欢几何？","s":"李白《春夜宴从弟桃花园序》","season":"spring"},{"t":"一切都是别人的，卢基里乌斯，唯有时间是我们自己的。","s":"塞涅卡《道德书简》一","n":"试译","l":"la","o":"Omnia, Lucili, aliena sunt, tempus tantum nostrum est."},{"t":"我们拥有的时间并不少，只是浪费得太多。","s":"塞涅卡《论生命之短暂》","n":"试译","l":"la","o":"Non exiguum temporis habemus, sed multum perdidimus."},{"t":"仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。","s":"王羲之《兰亭集序》","season":"spring"},{"t":"江畔何人初见月？江月何年初照人？\n人生代代无穷已，江月年年望相似。","s":"张若虚《春江花月夜》","season":"spring"},{"t":"桓公少与殷侯齐名，常有竞心。桓问殷：「卿何如我？」殷云：「我与我周旋久，宁作我。」","s":"《世说新语》品藻"},{"t":"愿意的，命运领着走；不愿意的，命运拖着走。","s":"塞涅卡《道德书简》一〇七","n":"试译","l":"la","o":"Ducunt volentem fata, nolentem trahunt."},{"t":"当狂风搅动大海，站在岸上看别人在风浪中挣扎，是一件甜美的事——不是因为别人受苦令人愉快，而是看清自己免于何种苦难，令人愉快。","s":"卢克莱修《物性论》卷二","n":"试译","l":"la","o":"Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem; non quia vexari quemquamst iucunda voluptas, sed quibus ipse malis careas quia cernere suave est.","w":1.4,"season":"winter"},{"t":"桓公北征经金城，见前为琅邪时种柳，皆已十围，慨然曰：「木犹如此，人何以堪！」攀枝执条，泫然流泪。","s":"《世说新语》言语","season":"spring"},{"t":"道可道，非常道；名可名，非常名。无名天地之始，有名万物之母。","s":"《老子》第一章"},{"t":"天下皆知美之为美，斯恶已；皆知善之为善，斯不善已。故有无相生，难易相成，长短相较，高下相倾，音声相和，前后相随。","s":"《老子》第二章"},{"t":"活着，就是思考。","s":"西塞罗《图斯库兰论辩》","n":"试译","l":"la","o":"Vivere est cogitare."},{"t":"那么时间是什么？没人问我，我知道；要向问的人解释，我便不知道了。","s":"奥古斯丁《忏悔录》卷十一","n":"试译","l":"la","o":"Quid est ergo tempus? Si nemo ex me quaerat, scio; si quaerenti explicare velim, nescio."},{"t":"人法地，地法天，天法道，道法自然。","s":"《老子》第二十五章"},{"t":"知人者智，自知者明。胜人者有力，自胜者强。知足者富，强行者有志。","s":"《老子》第三十三章"},{"t":"反者道之动，弱者道之用。天下万物生于有，有生于无。","s":"《老子》第四十章"},{"t":"风往南刮，又转向北，绕了又绕，仍回到它的圈子里。江河都往海里流，海却不满。","s":"《传道书》一章","n":"试译","l":"la","o":"Gyrat per meridiem, et flectitur ad aquilonem; lustrans universa in circuitu pergit spiritus, et in circulos suos revertitur. Omnia flumina intrant in mare, et mare non redundat.","w":1.3,"season":"autumn"},{"t":"风随着自己的意思吹，你听见它的声音，却不知道它从哪里来，往哪里去。","s":"《约翰福音》三章八节","n":"试译","l":"la","o":"Spiritus ubi vult spirat, et vocem eius audis, sed nescis unde veniat aut quo vadat.","w":1.2},{"t":"大方无隅，大器晚成，大音希声，大象无形。","s":"《老子》第四十一章"},{"t":"为学日益，为道日损。损之又损，以至于无为。无为而无不为。","s":"《老子》第四十八章"},{"t":"知者不言，言者不知。","s":"《老子》第五十六章","w":0.3},{"t":"我跳舞时便跳舞，睡觉时便睡觉；即便独自在美丽的果园里散步，如果我的思绪有一阵被别的事占去，我也会把它们领回来，领回到散步、果园、独处的甜美和我自己身上。","s":"蒙田《随笔》论经验","n":"试译","l":"fr","o":"Quand je dance, je dance ; quand je dors, je dors ; voire et quand je me promeine solitairement en un beau verger, si mes pensées se sont entretenues des occurences estrangeres quelque partie du temps, quelque autre partie je les rameine à la promenade, au verger, à la douceur de cette solitude et à moy.","w":0.6},{"t":"探讨哲学，就是学习死亡。","s":"蒙田《随笔》卷一","n":"试译","l":"fr","o":"Que philosopher, c'est apprendre à mourir."},{"t":"合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。","s":"《老子》第六十四章"},{"t":"人之生也柔弱，其死也坚强。草木之生也柔脆，其死也枯槁。故坚强者死之徒，柔弱者生之徒。","s":"《老子》第七十六章","season":"winter"},{"t":"天下莫柔弱于水，而攻坚强者莫之能胜，以其无以易之。","s":"《老子》第七十八章"},{"t":"世界不过是一架永恒的秋千。","s":"蒙田《随笔》论悔恨","n":"试译","l":"fr","o":"Le monde n'est qu'une branloire perenne."},{"t":"我知道什么？","s":"蒙田《随笔》卷二","n":"试译","l":"fr","o":"Que sçay-je ?"},{"t":"信言不美，美言不信。善者不辩，辩者不善。知者不博，博者不知。","s":"《老子》第八十一章"},{"t":"鹪鹩巢于深林，不过一枝；偃鼠饮河，不过满腹。","s":"《庄子》逍遥游"},{"t":"至人无己，神人无功，圣人无名。","s":"《庄子》逍遥游"},{"t":"人只是一根芦苇，自然界最脆弱的东西；但他是一根会思想的芦苇。要压垮他，用不着整个宇宙动手，一缕水汽、一滴水就够了。然而即便宇宙压垮了他，人仍比杀死他的东西高贵，因为他知道自己会死，也知道宇宙对他的优势；而宇宙对此一无所知。","s":"帕斯卡《思想录》","n":"试译","l":"fr","o":"L'homme n'est qu'un roseau, le plus faible de la nature ; mais c'est un roseau pensant."},{"t":"这些无限空间的永恒沉默，使我恐惧。","s":"帕斯卡《思想录》","n":"试译","l":"fr","o":"Le silence éternel de ces espaces infinis m'effraie."},{"t":"且夫水之积也不厚，则其负大舟也无力。覆杯水于坳堂之上，则芥为之舟；置杯焉则胶，水浅而舟大也。风之积也不厚，则其负大翼也无力。","s":"《庄子》逍遥游","w":1.3},{"t":"昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？周与胡蝶，则必有分矣。此之谓物化。","s":"《庄子》齐物论"},{"t":"天地与我并生，而万物与我为一。","s":"《庄子》齐物论"},{"t":"心有它的理由，是理性所不知道的。","s":"帕斯卡《思想录》","n":"试译","l":"fr","o":"Le cœur a ses raisons que la raison ne connaît point."},{"t":"人的一切不幸只来自一件事：不知道如何安静地待在一个房间里。","s":"帕斯卡《思想录》","n":"试译","l":"fr","o":"Tout le malheur des hommes vient d'une seule chose, qui est de ne savoir pas demeurer en repos dans une chambre.","w":0.3},{"t":"六合之外，圣人存而不论；六合之内，圣人论而不议。","s":"《庄子》齐物论"},{"t":"彼节者有间，而刀刃者无厚；以无厚入有间，恢恢乎其于游刃必有余地矣。","s":"《庄子》养生主"},{"t":"瞻彼阕者，虚室生白，吉祥止止。","s":"《庄子》人间世","w":0.25},{"t":"我是，我存在，这是确定的。可是能确定多久？就在我思想的时候；因为也许一旦我完全停止思想，我就同时完全不再存在了。","s":"笛卡尔《第一哲学沉思集》二","n":"试译","l":"la","o":"Ego sum, ego existo; certum est. Quandiu autem? Nempe quandiu cogito."},{"t":"良知是世上分配得最均匀的东西。","s":"笛卡尔《谈谈方法》","n":"试译","l":"fr","o":"Le bon sen <script>

  const perm = new Uint8Array(512);
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const k = perm[i]; perm[i] = perm[j]; perm[j] = k; }
  for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
  const fade = x => x * x * (3 - 2 * x);
  function noise(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const fx = x - Math.floor(x), fy = y - Math.floor(y);
    const a = perm[perm[X] + Y] / 255, b = perm[perm[X + 1] + Y] / 255,
          c = perm[perm[X] + Y + 1] / 255, d = perm[perm[X + 1] + Y + 1] / 255;
    const u = fade(fx), v = fade(fy);
    const top = a + (b - a) * u, bot = c + (d - c) * u;
    return top + (bot - top) * v;   // 0..1
  }
  const field = (x, y, tt) =>
    (noise(x * .0022 + tt * .05, y * .0022) * .7 + noise(x * .006 - tt * .03, y * .006 + tt * .02) * .3) * Math.PI * 2;

  function spawn() {
    return { x: rnd(0, W), y: rnd(0, H), vx: 0, vy: 0, life: rnd(80, 320), age: 0, w: rnd(.5, 1.3), trail: [] };
  }
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(1200, Math.max(160, W * H / (lowEnd ? 3000 : 1700) * SEA.count)));
    particles = Array.from({ length: n }, spawn);
  }
  function windColor() {
    const cs = getComputedStyle(document.documentElement);
    return { rgb: cs.getPropertyValue("--wind").trim(), a: (parseFloat(cs.getPropertyValue("--wind-alpha")) || .2) * SEA.alpha };
  }
  let color = null, colorTick = 0;

  function step() {
    t += 1 / 60;
    if (!color || ++colorTick > 90) { color = windColor(); colorTick = 0; }
    gust *= .96;
    windK += (windTarget - windK) * .02;
    pointer.vx *= .9; pointer.vy *= .9;

    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(" + color.rgb + "," + (color.a * (.45 + .55 * Math.min(windK, 1))) + ")";

    const base = -(SEA.speed * windK + gust * 2.2);     // 风从右往左
    const trailLen = Math.max(4, Math.round(SEA.trail * Math.min(windK, 1.4))) * 2;
    for (const p of particles) {
      const a = field(p.x, p.y, t);
      const ax = Math.cos(a) * .35 * windK + base, ay = Math.sin(a) * .35 * windK + SEA.lift - gust * .08;
      // 指针：靠近的被推开，指针的速度带起一阵
      const dx = p.x - pointer.x, dy = p.y - pointer.y, d2 = dx * dx + dy * dy, R = pointer.down ? 260 : 150;
      if (d2 < R * R) {
        const d = Math.sqrt(d2) + .01, f = 1 - d / R, k = pointer.down ? 1.4 : .5;
        p.vx += (dx / d) * f * k + pointer.vx * f * .18;
        p.vy += (dy / d) * f * k + pointer.vy * f * .18;
      }
      p.vx = (p.vx + ax) * .92; p.vy = (p.vy + ay) * .92;
      p.x += p.vx; p.y += p.vy; p.age++;
      p.trail.push(p.x, p.y);
      while (p.trail.length > trailLen) p.trail.splice(0, 2);
      if (p.age > p.life || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
        const q = spawn(); if (Math.random() < .7) { q.x = W + 10; q.y = rnd(0, H); }
        Object.assign(p, q); continue;
      }
      const k = Math.min(1, p.age / 30) * Math.min(1, (p.life - p.age) / 30);   // 生灭都是渐的
      if (p.trail.length < 4) continue;
      ctx.globalAlpha = k;
      ctx.lineWidth = p.w * SEA.width;
      ctx.beginPath();
      ctx.moveTo(p.trail[0], p.trail[1]);
      for (let i = 2; i < p.trail.length; i += 2) ctx.lineTo(p.trail[i], p.trail[i + 1]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(step);
  }

  /* ========== 文字：吹进来，吹出去 ========== */
  const textEl = $("text"), srcEl = $("source"), origEl = $("orig");
  let glyphs = [];

  function layout(p) {
    textEl.replaceChildren(); srcEl.replaceChildren();
    glyphs = [];
    for (const ch of p.t) {
      if (ch === "\n") { textEl.appendChild(document.createElement("br")); continue; }
      const s = document.createElement("span");
      s.className = "ch"; s.textContent = ch;
      textEl.appendChild(s); glyphs.push(s);
    }
    windTarget = (p.w == null) ? 1 : p.w;
    const drop = glyphs.length < 12 ? "8%" : glyphs.length < 40 ? "26%" : "42%";
    srcEl.style.setProperty("--drop", drop);
    origEl.textContent = p.o || "";
    if (p.l) origEl.setAttribute("lang", p.l); else origEl.removeAttribute("lang");
    srcEl.textContent = p.s;
    if (p.n) { const n = document.createElement("span"); n.className = "note"; n.textContent = p.n; srcEl.appendChild(n); }
  }

  function blowIn() {
    const n = glyphs.length, step = Math.min(.03, 2.4 / Math.max(1, n));
    glyphs.forEach((g, i) => {
      // 每个字从右上方、沿风来的方向落位；远近不一，像被同一阵风带到
      const dist = rnd(140, 420), lift = rnd(-70, 30);
      g.style.setProperty("--d", (i * step + rnd(0, .25)).toFixed(3) + "s");
      g.style.setProperty("--dur", rnd(1.4, 2.3).toFixed(2) + "s");
      g.style.transform = "translate(" + dist + "px," + lift + "px) rotate(" + rnd(-14, 14) + "deg)";
      g.style.filter = "blur(" + (isMobile ? 3 : 6) + "px)";
      g.classList.remove("in");
    });
    const sd = (n * step + 1.2).toFixed(2) + "s";
    srcEl.style.setProperty("--sd", sd); origEl.style.setProperty("--sd", sd);
    srcEl.classList.remove("in"); origEl.classList.remove("in");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      glyphs.forEach(g => { g.style.transform = ""; g.style.filter = ""; g.classList.add("in"); });
      srcEl.classList.add("in"); origEl.classList.add("in");
    }));
    gust = Math.max(gust, .8);
  }

  function blowOut() {
    return new Promise(res => {
      const n = glyphs.length, step = Math.min(.012, 1 / Math.max(1, n));
      glyphs.forEach((g, i) => {
        g.style.setProperty("--d", (i * step * (Math.random() < .5 ? 1 : .6)).toFixed(3) + "s");
        g.style.setProperty("--dur", rnd(.8, 1.3).toFixed(2) + "s");
        g.classList.remove("in");
        g.style.transform = "translate(" + (-rnd(260, 560)) + "px," + rnd(-40, 90) + "px) rotate(" + rnd(-25, 25) + "deg)";
        g.style.filter = "blur(" + (isMobile ? 4 : 8) + "px)";
      });
      srcEl.style.setProperty("--sd", "0s"); srcEl.classList.remove("in");
      origEl.style.setProperty("--sd", "0s"); origEl.classList.remove("in");
      gust = Math.max(gust, 1.6);
      setTimeout(res, 1500);
    });
  }

  /* ========== 换日 ========== */
  let day = parse(new URLSearchParams(location.search).get("d"));
  const dateEl = $("date"), yEl = $("yesterday"), tEl = $("today");
  let busy = false;

  function setDay(d, push) {
    day = d;
    dateEl.textContent = cn(d); dateEl.dateTime = fmt(d);
    const y = new Date(d); y.setDate(y.getDate() - 1);
    yEl.href = "?d=" + fmt(y);
    tEl.hidden = !(d < today);
    if (push) history.pushState(null, "", d < today ? "?d=" + fmt(d) : location.pathname);
  }
  async function go(d, push) {
    if (busy) return; busy = true;
    if (!reduced) await blowOut();
    setDay(d, push);
    layout(pick(d));
    if (reduced) { glyphs.forEach(g => g.classList.add("in")); srcEl.classList.add("in"); origEl.classList.add("in"); }
    else blowIn();
    busy = false;
  }
  yEl.addEventListener("click", e => { e.preventDefault(); const y = new Date(day); y.setDate(y.getDate() - 1); go(y, true); });
  tEl.addEventListener("click", e => { e.preventDefault(); go(today, true); });
  $("mark").addEventListener("click", e => { e.preventDefault(); if (day < today) go(today, true); else gust = Math.max(gust, 1.2); });
  addEventListener("popstate", () => go(parse(new URLSearchParams(location.search).get("d")), false));

  /* ========== 指针 ========== */
  let lx = 0, ly = 0, lt = 0;
  function move(x, y) {
    const n = performance.now(), dt = Math.max(8, n - lt);
    pointer.vx = (x - lx) / dt * 16; pointer.vy = (y - ly) / dt * 16;
    pointer.x = x; pointer.y = y; lx = x; ly = y; lt = n;
  }
  addEventListener("pointermove", e => move(e.clientX, e.clientY), { passive: true });
  addEventListener("pointerleave", () => { pointer.x = pointer.y = -1e4; });
  addEventListener("pointerdown", e => {
    if (e.target.closest("a")) return;
    pointer.down = true; move(e.clientX, e.clientY);
    gust = Math.max(gust, .6);
    // 按住的时候，字被吹得散一点；松开就回去
    glyphs.forEach(g => {
      if (!g.classList.contains("in")) return;
      g.style.transition = "transform 1.2s cubic-bezier(.2,.7,.2,1)";
      g.style.transform = "translate(" + rnd(-16, 4) + "px," + rnd(-8, 8) + "px) rotate(" + rnd(-3, 3) + "deg)";
    });
  });
  const release = () => {
    pointer.down = false;
    glyphs.forEach(g => { if (g.classList.contains("in")) { g.style.transform = ""; g.style.transition = ""; } });
  };
  addEventListener("pointerup", release); addEventListener("pointercancel", release);

  /* ========== 风声（可选，默认关） ========== */
  let audio = null;
  function toggleSound(btn) {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ac = new AC();
      const len = ac.sampleRate * 4, buf = ac.createBuffer(1, len, ac.sampleRate), data = buf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {          // 粉噪声
        const w = Math.random() * 2 - 1;
        b0 = .997 * b0 + .029 * w; b1 = .985 * b1 + .032 * w; b2 = .95 * b2 + .048 * w;
        data[i] = (b0 + b1 + b2 + w * .05) * .25;
      }
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 420; bp.Q.value = .9;
      const lfo = ac.createOscillator(); lfo.type = "sine"; lfo.frequency.value = .11;
      const lfoG = ac.createGain(); lfoG.gain.value = 260;
      lfo.connect(lfoG).connect(bp.frequency);
      const gain = ac.createGain(); gain.gain.value = 0;
      src.connect(bp).connect(gain).connect(ac.destination);
      src.start(); lfo.start();
      audio = { ac, gain, on: false };
      // 风大的时候声音也大
      (function follow() { if (audio.on) audio.gain.gain.setTargetAtTime(.05 + gust * .06, ac.currentTime, .2); requestAnimationFrame(follow); })();
    }
    audio.on = !audio.on;
    if (audio.ac.state === "suspended") audio.ac.resume();
    audio.gain.gain.setTargetAtTime(audio.on ? .05 : 0, audio.ac.currentTime, .8);
    btn.setAttribute("aria-pressed", String(audio.on));
  }
  $("sound").addEventListener("click", e => { e.preventDefault(); toggleSound(e.currentTarget); });

  /* ========== 起 ========== */
  addEventListener("resize", resize);
  resize();
  if (!reduced) requestAnimationFrame(step);
  setDay(day, false);
  layout(pick(day));
  if (reduced) { glyphs.forEach(g => g.classList.add("in")); srcEl.classList.add("in"); origEl.classList.add("in"); }
  else setTimeout(blowIn, 250);
})();
</script>
</body>
</html>
